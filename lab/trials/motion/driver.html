<meta charset="utf-8"><script type="module">
import {Renderer,Vector2} from '@motion-canvas/core';
window.run=async(which,scale)=>{
 const project=(await import(which==='reveal'?'/reveal-project.ts?project':'/project.ts?project')).default;
 project.logger.onLogged.subscribe(x=>console.log(JSON.stringify(x)));
 const renderer=new Renderer(project);let result;renderer.onFinished.subscribe(x=>result=x);
 await renderer.render({name:which,range:[0,which==='reveal'?10:15],fps:30,size:new Vector2(1080,1920),resolutionScale:scale,colorSpace:'srgb',background:'#f5efdf',exporter:{name:'@motion-canvas/core/image-sequence',options:{fileType:'image/png',quality:100,groupByScene:false}}});
 if(result!==0)throw new Error('Renderer result '+result);
 return result;
};
</script>
